[project]
name = "coffeeroaster04"
version = "1.3.0"
description = "Crackle: a Flask web app for logging home coffee roasts and managing roast profiles."
readme = "README.md"
authors = [
    { name = "Joshua George", email = "josh.george7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

# No [build-system]: this is an application run from its own folder
# (`python app.py`, or `from app import app` in the WSGI file), not an
# installable package.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests live in tests/ but import the top-level modules (app, calculations, ...).
pythonpath = ["."]
testpaths = ["tests"]
