{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <button class="btn btn--ghost back-link" onclick="window.location='/'">&larr; Back to menu</button>
  <h1>Log in</h1>

  {% if error %}
    <p style="color: var(--color-danger);">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <p>
      <label>Email<br>
        <input type="email" name="email" value="{{ values.email }}">
      </label>
    </p>
    <p>
      <label>Password<br>
        <input type="password" name="password">
      </label>
    </p>
    <button class="btn btn--primary" type="submit">Log in</button>
  </form>

  <p><a href="/forgot-password">Forgot password?</a></p>
  <p>Don't have an account? <a href="/signup{{ '?next=' + next if next else '' }}">Sign up</a></p>
{% endblock %}
