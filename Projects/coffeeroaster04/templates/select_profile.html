{% extends "base.html" %}
{% block title %}Add roast &mdash; select profile{% endblock %}
{% block content %}
  <button class="btn btn--ghost back-link" onclick="window.location='/'">&larr; Back to menu</button>
  <h1>Select a roast profile</h1>
  {% if profiles %}
    {% set profile_link_prefix = "/roasts/new/" %}
    {% include "_profile_table.html" %}
  {% else %}
    <p>No roast profiles exist yet.</p>
    <button class="btn btn--primary" onclick="window.location='/profiles/new'">Create a roast profile</button>
  {% endif %}
{% endblock %}
