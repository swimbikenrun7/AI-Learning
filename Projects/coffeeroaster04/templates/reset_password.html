{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <button class="btn btn--ghost back-link" onclick="window.location='/login'">&larr; Back to log in</button>
  <h1>Reset password</h1>

  {% if valid %}
    {% if error %}
      <p style="color: var(--color-danger);">{{ error }}</p>
    {% endif %}
    <form method="post">
      <p>
        <label>New password (at least 8 characters)<br>
          <input type="password" name="password">
        </label>
      </p>
      <p>
        <label>Confirm new password<br>
          <input type="password" name="confirm">
        </label>
      </p>
      <button class="btn btn--primary" type="submit">Set new password</button>
    </form>
  {% else %}
    <p style="color: var(--color-danger);">This reset link is invalid or has expired.</p>
    <button class="btn btn--primary" onclick="window.location='/forgot-password'">Request a new link</button>
  {% endif %}
{% endblock %}
