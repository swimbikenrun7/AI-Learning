{% extends "base.html" %}
{% block title %}Delete roast{% endblock %}
{% block content %}
  <button class="btn back-link" onclick="window.location='/roasts/{{ record_id }}'">&larr; Back to roast</button>
  <h1>Delete this roast?</h1>
  <p>{{ record.bean_name }} &mdash; {{ record.date }}</p>
  <p>This cannot be undone.</p>
  <form method="post">
    <button class="btn" type="submit">Delete roast</button>
  </form>
{% endblock %}
