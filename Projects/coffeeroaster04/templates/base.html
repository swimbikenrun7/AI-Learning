<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Coffee Roast Logger{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='14' width='16' height='12' rx='2' fill='%23a15c2e'/%3E%3Cpath d='M22 16h3a3 3 0 0 1 0 6h-3' fill='none' stroke='%23a15c2e' stroke-width='2.5'/%3E%3Crect x='8' y='17' width='12' height='3' fill='%23fff8f0'/%3E%3Cpath d='M11 6c0 2-2 2-2 4s2 2 2 4' fill='none' stroke='%237a6a5c' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M16 6c0 2-2 2-2 4s2 2 2 4' fill='none' stroke='%237a6a5c' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --color-bg: #faf6f0;
      --color-surface: #fffdfb;
      --color-text: #2b2118;
      --color-text-muted: #7a6a5c;
      --color-border: #e2d8cb;
      --color-accent: #a15c2e;
      --color-accent-hover: #8a4b23;
      --color-danger: #b3402c;
      --color-danger-hover: #96311f;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2.5rem;

      --font-size-sm: 0.85rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.25rem;
      --font-size-xl: 2rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--font-size-base);
      margin: 0;
      color: var(--color-text);
      background: var(--color-bg);
    }
    .site-header { background: var(--color-text); }
    .site-header__inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-bg);
    }
    .site-header__brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: inherit;
      text-decoration: none;
    }
    .site-header__brand:hover { opacity: 0.85; text-decoration: none; }
    .site-header__name { font-size: var(--font-size-lg); font-weight: 700; letter-spacing: -0.01em; }
    .site-header__account {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-sm);
    }
    .site-header__account a { color: var(--color-bg); }
    .site-header__account form { margin: 0; }
    .site-header__account button {
      background: none;
      border: none;
      color: var(--color-bg);
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
      padding: 0;
    }
    .page {
      max-width: 1100px;
      margin: var(--space-4) auto;
      padding: var(--space-5) var(--space-4);
      background: var(--color-surface);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(43, 33, 24, 0.08), 0 8px 24px rgba(43, 33, 24, 0.06);
    }
    .table-scroll { overflow-x: auto; }
    @media (max-width: 640px) {
      .site-header__inner { padding: var(--space-2) var(--space-3); }
      .page { margin: var(--space-3) var(--space-2); padding: var(--space-4) var(--space-3); }
      h1 { font-size: 1.5rem; }
    }
    h1 {
      font-size: var(--font-size-xl);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--color-text);
      margin: 0 0 var(--space-4);
    }
    table { border-collapse: collapse; margin-top: var(--space-3); background: var(--color-surface); }
    th, td { border: 1px solid var(--color-border); padding: 0.4rem 0.8rem; text-align: right; }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3) { text-align: left; }
    tbody tr:nth-child(even) { background: #f7f1e9; }
    tbody tr:hover { background: #f3ece3; }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    label {
      display: block;
      font-weight: 600;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-1);
    }
    input[type="text"], input[type="password"], input[type="email"] {
      font-family: inherit;
      font-size: var(--font-size-base);
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-surface);
      color: var(--color-text);
    }
    input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
      border-color: var(--color-accent);
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1rem;
      font-size: var(--font-size-sm);
      font-family: inherit;
      border: 1px solid var(--color-accent);
      background: var(--color-surface);
      color: var(--color-accent);
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }
    .btn:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); color: #fff; }
    .btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .btn--primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    .btn--ghost { border-color: transparent; background: transparent; color: var(--color-text-muted); }
    .btn--ghost:hover { background: #efe6da; border-color: transparent; color: var(--color-text); }
    .btn--danger { border-color: var(--color-danger); color: var(--color-danger); }
    .btn--danger:hover { background: var(--color-danger-hover); border-color: var(--color-danger-hover); color: #fff; }
    .back-link { margin-bottom: var(--space-3); }
    .actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); }
    .menu { display: flex; flex-direction: column; gap: var(--space-2); width: 280px; margin-top: var(--space-4); }
    .menu button { padding: 0.7rem 1rem; font-size: var(--font-size-base); }
  </style>
</head>
<body>
  <div id="splash">
    <div id="backdrop" class="curtain-piece"></div>
    <svg id="splash-svg" width="240" height="240" viewBox="0 0 28 28" shape-rendering="crispEdges">
      <g id="steam-1" class="steam">
        <rect x="9" y="10" width="2" height="2" fill="#8a8f94" />
        <rect x="11" y="8" width="2" height="2" fill="#8a8f94" />
        <rect x="9" y="6" width="2" height="2" fill="#8a8f94" />
        <rect x="11" y="4" width="2" height="2" fill="#8a8f94" />
      </g>
      <g id="steam-2" class="steam">
        <rect x="15" y="10" width="2" height="2" fill="#8a8f94" />
        <rect x="17" y="8" width="2" height="2" fill="#8a8f94" />
        <rect x="15" y="6" width="2" height="2" fill="#8a8f94" />
        <rect x="17" y="4" width="2" height="2" fill="#8a8f94" />
      </g>
      <rect x="7" y="13" width="11" height="8" fill="#ede6d9" />
      <rect x="8" y="14" width="9" height="2" fill="#3b2412" />
      <rect x="18" y="14" width="3" height="1" fill="#ede6d9" />
      <rect x="18" y="18" width="3" height="1" fill="#ede6d9" />
      <rect x="20" y="14" width="1" height="5" fill="#ede6d9" />
    </svg>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      overflow: hidden;
    }
    .curtain-piece {
      position: absolute;
      inset: 0;
      background: #000;
    }
    #splash-svg {
      position: relative;
      z-index: 1;
    }
    .steam rect {
      animation: steam-rise 0.6s ease-in-out infinite;
    }
    .steam rect:nth-child(2) { animation-delay: 0.08s; }
    .steam rect:nth-child(3) { animation-delay: 0.16s; }
    .steam rect:nth-child(4) { animation-delay: 0.24s; }
    #steam-2 rect { animation-delay: 0.15s; }
    #steam-2 rect:nth-child(2) { animation-delay: 0.23s; }
    #steam-2 rect:nth-child(3) { animation-delay: 0.31s; }
    #steam-2 rect:nth-child(4) { animation-delay: 0.39s; }
    @keyframes steam-rise {
      0% { transform: translateY(0); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-4px); opacity: 0; }
    }
  </style>
  <script>
    (function () {
      // TODO(future): once a user-settings screen exists, let this whole
      // splash+transition be disabled from there instead of always running.
      var SHOW_MS = 375;
      var splash = document.getElementById("splash");
      var svg = document.getElementById("splash-svg");

      var SEAM_VERTICAL =
        "50% 0%, 40% 8.33%, 60% 16.67%, 40% 25%, 60% 33.33%, 40% 41.67%, " +
        "60% 50%, 40% 58.33%, 60% 66.67%, 40% 75%, 60% 83.33%, 40% 91.67%, 50% 100%";
      var SEAM_HORIZONTAL =
        "0% 50%, 8.33% 40%, 16.67% 60%, 25% 40%, 33.33% 60%, 41.67% 40%, " +
        "50% 60%, 58.33% 40%, 66.67% 60%, 75% 40%, 83.33% 60%, 91.67% 40%, 100% 50%";

      function finish() {
        splash.remove();
      }

      function addPiece() {
        var piece = document.createElement("div");
        piece.className = "curtain-piece";
        splash.appendChild(piece);
        return piece;
      }

      function runRows() {
        var rowCount = 10;
        var duration = 675;
        var rows = [];
        for (var i = 0; i < rowCount; i++) {
          var row = addPiece();
          row.style.top = (i * 100 / rowCount) + "%";
          row.style.height = (100 / rowCount) + "%";
          row.style.transition = "transform " + duration + "ms ease-in-out " + (i * 45) + "ms";
          rows.push(row);
        }
        requestAnimationFrame(function () {
          rows.forEach(function (row, i) {
            row.style.transform = "translateX(" + (i % 2 === 0 ? "-100%" : "100%") + ")";
          });
        });
        setTimeout(finish, duration + rowCount * 45 + 50);
      }

      function runSawtooth() {
        var duration = 675;
        var left = addPiece();
        left.style.clipPath = "polygon(0% 0%, " + SEAM_VERTICAL + ", 0% 100%)";
        left.style.transition = "transform " + duration + "ms ease-in";

        var right = addPiece();
        right.style.clipPath = "polygon(100% 0%, " + SEAM_VERTICAL + ", 100% 100%)";
        right.style.transition = "transform " + duration + "ms ease-in";

        requestAnimationFrame(function () {
          left.style.transform = "translateX(-100%)";
          right.style.transform = "translateX(100%)";
        });
        setTimeout(finish, duration + 50);
      }

      function runZipper() {
        var duration = 675;
        var top = addPiece();
        top.style.clipPath = "polygon(0% 0%, " + SEAM_HORIZONTAL + ", 100% 0%)";
        top.style.transition = "transform " + duration + "ms ease-in";

        var bottom = addPiece();
        bottom.style.clipPath = "polygon(0% 100%, " + SEAM_HORIZONTAL + ", 100% 100%)";
        bottom.style.transition = "transform " + duration + "ms ease-in";

        requestAnimationFrame(function () {
          top.style.transform = "translateY(-100%)";
          bottom.style.transform = "translateY(100%)";
        });
        setTimeout(finish, duration + 50);
      }

      var EFFECTS = [runRows, runSawtooth, runZipper];

      setTimeout(function () {
        svg.style.display = "none";
        document.getElementById("backdrop").remove();
        EFFECTS[Math.floor(Math.random() * EFFECTS.length)]();
      }, SHOW_MS);
    })();
  </script>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/" aria-label="Go to home">
        <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="6" y="14" width="16" height="12" rx="2" fill="var(--color-bg)"/>
          <path d="M22 16h3a3 3 0 0 1 0 6h-3" fill="none" stroke="var(--color-bg)" stroke-width="2.5"/>
          <rect x="8" y="17" width="12" height="3" fill="var(--color-accent)"/>
          <path d="M11 6c0 2-2 2-2 4s2 2 2 4" fill="none" stroke="#a89a8c" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 6c0 2-2 2-2 4s2 2 2 4" fill="none" stroke="#a89a8c" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="site-header__name">Coffee Roast Logger</span>
      </a>
      <div class="site-header__account">
        {% if session.user_email %}
          {% if current_user and not current_user.email_verified %}
            <form method="post" action="/resend-verification">
              <button type="submit">Verify your email</button>
            </form>
          {% endif %}
          <span>{{ session.user_email }}</span>
          <form method="post" action="/logout">
            <button type="submit">Log out</button>
          </form>
        {% else %}
          <a href="/login">Log in</a>
        {% endif %}
      </div>
    </div>
  </header>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
