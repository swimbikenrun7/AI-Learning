{% extends "base.html" %}
{% block title %}Roast profiles{% endblock %}
{% block content %}
  <button class="btn btn--ghost back-link" onclick="window.location='/'">&larr; Back to menu</button>
  <h1>Roast profiles</h1>
  <div class="actions">
    <button class="btn btn--primary" onclick="window.location='/profiles/new'">+ Add new profile</button>
  </div>
  {% if profiles %}
    {% set profile_link_prefix = "/profiles/" %}
    {% include "_profile_table.html" %}
  {% else %}
    <p>No roast profiles exist yet.</p>
  {% endif %}
{% endblock %}
