{% extends "base.html" %}
{% block title %}Roast profiles{% endblock %}
{% block content %}
  <button class="btn back-link" onclick="window.location='/'">&larr; Back to menu</button>
  <h1>Roast profiles</h1>
  <div class="actions">
    <button class="btn" onclick="window.location='/profiles/new'">+ Add new profile</button>
  </div>
  {% if profiles %}
    <ul>
      {% for profile_id, profile in profiles.items() %}
        <li><a href="/profiles/{{ profile_id }}">{{ profile.name }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No roast profiles exist yet.</p>
  {% endif %}
{% endblock %}
